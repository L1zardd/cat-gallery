<div class="cat-card">
  <div class="cat-image-container">
    <img 
      [src]="cat.imageUrl" 
      [alt]="cat.name"
      class="cat-image"
      (click)="onImageClick()"
      onerror="this.src='assets/images/cats/placeholder.jpg'"
    >
    
    <!-- Бейдж "Требуется авторизация" при наведении на неактивную звезду -->
    <div class="auth-overlay" *ngIf="!isAuthenticated && showAuthTooltip" (mouseleave)="showAuthTooltip = false">
      <div class="auth-tooltip">
        <p>🔐 Требуется регистрация</p>
        <button class="auth-btn" routerLink="/">Войти</button>
      </div>
    </div>
  </div>
  
  <div class="cat-info">
    <h3 class="cat-name">{{ cat.name }}</h3>
    
    <div class="cat-tags">
      <span *ngFor="let tag of cat.tags" class="tag">
        {{ tag }}
      </span>
    </div>
    
    <div class="cat-actions">
      <button 
        class="favorite-btn"
        (click)="onFavoriteClick()"
        [class.active]="cat.isFavorite && isAuthenticated"
        [class.disabled]="!isAuthenticated"
        [title]="!isAuthenticated ? 'Войдите, чтобы добавлять в избранное' : (cat.isFavorite ? 'Удалить из избранного' : 'Добавить в избранное')"
        (mouseenter)="!isAuthenticated && (showAuthTooltip = true)"
        (mouseleave)="showAuthTooltip = false"
      >
        <span class="star-icon">{{ (cat.isFavorite && isAuthenticated) ? '★' : '☆' }}</span>
        {{ (cat.isFavorite && isAuthenticated) ? 'В Избранном' : 'В Избранное' }}
      </button>
    </div>
  </div>
</div>
