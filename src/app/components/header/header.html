<header class="header" *ngIf="user.isAuthenticated">
  <nav class="container">
    <div class="header-content">
      <div class="header-left">
        <a 
          routerLink="/main" 
          routerLinkActive="active" 
          class="nav-link"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Главная
        </a>
        <a 
          routerLink="/favorites" 
          routerLinkActive="active" 
          class="nav-link"
        >
          Избранное
          <span class="favorites-badge" *ngIf="favoritesCount > 0">
            {{ favoritesCount }}
          </span>
        </a>
      </div>
      
      <div class="header-right">
        <div 
          class="user-profile" 
          [routerLink]="['/profile']"
          [title]="'Перейти в профиль'"
        >
          <img 
            [src]="user.avatarUrl" 
            [alt]="user.username" 
            class="user-avatar"
            onerror="this.src='assets/images/avatars/default-avatar.jpg'"
          >
          <span class="user-name">{{ user.username }}</span>
        </div>
      </div>
    </div>
  </nav>
</header>
